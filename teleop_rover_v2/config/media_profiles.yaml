camera:
  device: /dev/video0
  width: 1280
  height: 720
  fps: 30

transport:
  signaling_url: ws://127.0.0.1:13437/ws
  force_relay: true

control:
  command_rate_hz: 50
  command_valid_for_ms: 200
  watchdog_ms: 250
  max_future_clock_skew_ms: 50

# Ordered preference. Runtime probing removes codecs without a usable encoder.
video:
  codec_preference: [AV1, VP9, H264]
  target_bitrate_bps: 2000000
  keyframe_interval_frames: 30
  b_frames: 0
  latency_mode: realtime
